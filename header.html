<header class="bg-white  border-b border-slate-200  sticky top-0 z-50 h-16 flex items-center justify-center shrink-0 transition-all">
  <div class="app-header-inner w-full max-w-6xl mx-auto px-4 flex items-center justify-between">

    <img
      src="/images/PLC_Logo_FA_Horizontal_COLOUR.png"
      alt="Pala Language Centre Logo"
      class="h-10 sm:h-12 w-auto object-contain transition-transform duration-300 hover:scale-105"
      onerror="this.outerHTML='<span class=\'text-2xl font-bold text-custom-pink-600 tracking-tight\'>PALA<span class=\'text-slate-800\'>CENTRE</span></span>'"
    >

    <div class="site-header-actions">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Chế độ tối" aria-pressed="false" title="Bật hoặc tắt chế độ tối">
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>
        </svg>
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
        </svg>
      </button>
    <form action="/logout" method="POST" class="site-logout">
      <button type="submit" aria-label="Đăng xuất" title="Đăng xuất">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H5v14h4m6-14 7 7-7 7m7-7H9"/>
        </svg>
        <span>Đăng xuất</span>
      </button>
    </form>
    </div>

  </div>
</header>
